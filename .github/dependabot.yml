version: 2

# third_party/mihomo is deliberately not listed: it is a pristine upstream
# import that changes only through documented patch commits and a reviewed
# re-import (see third_party/README.md). The npm packages have no registry
# dependencies; their optionalDependencies are the project's own packages.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
