name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and upload artifacts without publishing'
        type: boolean
        default: true

permissions:
  contents: read

env:
  KTAV_VERSION: '0.8.0'

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        run: |
          set -euo pipefail
          mkdir -p build dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "build/netivri${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/netivri
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'

      - name: Fetch Ktav native library
        shell: bash
        run: |
          set -euo pipefail
          KTAV_LIB="$(bash scripts/fetch-ktav-lib.sh \
            "${{ matrix.goos }}" "${{ matrix.goarch }}" staging | tail -n 1)"
          echo "KTAV_LIB=$KTAV_LIB" >> "$GITHUB_ENV"

      - name: Collect third-party licenses
        shell: bash
        run: bash scripts/collect-licenses.sh build/THIRD_PARTY_LICENSES
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'

      - name: Stage and archive
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          NAME="netivri_${VER}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "pkg/$NAME"
          BIN="netivri${{ matrix.goos == 'windows' && '.exe' || '' }}"
          cp "build/$BIN" "pkg/$NAME/"
          cp "$KTAV_LIB" "pkg/$NAME/"
          cp LICENSE README.md "pkg/$NAME/"
          cp -R build/THIRD_PARTY_LICENSES "pkg/$NAME/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd pkg && zip -q -r "$NAME.zip" "$NAME")
            mv "pkg/$NAME.zip" dist/
          else
            tar -czf "dist/$NAME.tar.gz" -C pkg "$NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  npm-packages:
    name: npm packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: dist-*

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release archives
        run: |
          set -euo pipefail
          mkdir -p extracted
          for f in artifacts/netivri_*.tar.gz; do tar -xzf "$f" -C extracted; done
          for f in artifacts/netivri_*.zip; do unzip -q "$f" -d extracted; done

      - name: Build npm packages
        run: |
          set -euo pipefail
          node npm/scripts/build-packages.js \
            --version "${{ steps.version.outputs.version }}" \
            --archive-dir extracted --out npm-out

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p npm-dist
          for d in npm-out/*/; do
            (cd "$d" && npm pack --pack-destination "${GITHUB_WORKSPACE}/npm-dist")
          done
          ls -l npm-dist

      - uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: npm-dist/*.tgz
          if-no-files-found: error

  npm-publish:
    name: publish to npm
    if: github.event_name == 'push'
    needs: [publish, npm-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: npm-dist

      # Publishes only when the repository secret NPM_TOKEN exists; the six
      # platform packages go first, the main package last, so a half-failed
      # run never leaves a main package pointing at missing binaries.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set: skipping the npm publish"
            exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            npm publish "npm-dist/netivri-${p}-${VER}.tgz" --access public
          done
          npm publish "npm-dist/netivri-${VER}.tgz" --access public

  publish:
    name: checksums and release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: dist-*

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum netivri_*.zip netivri_*.tar.gz > SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/SHA256SUMS artifacts/netivri_*.zip artifacts/netivri_*.tar.gz
