name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and upload artifacts without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Fail fast: a tag without a changelog entry is not released.
      - name: Check the changelog entry
        if: github.event_name == 'push'
        shell: bash
        run: bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        run: |
          set -euo pipefail
          mkdir -p build dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "build/netivri${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/netivri
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'

      - name: Collect third-party licenses
        shell: bash
        run: bash scripts/collect-licenses.sh build/THIRD_PARTY_LICENSES
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'

      - name: Stage and archive
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          NAME="netivri_${VER}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "pkg/$NAME"
          BIN="netivri${{ matrix.goos == 'windows' && '.exe' || '' }}"
          cp "build/$BIN" "pkg/$NAME/"
          cp LICENSE README.md "pkg/$NAME/"
          cp -R build/THIRD_PARTY_LICENSES "pkg/$NAME/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd pkg && zip -q -r "$NAME.zip" "$NAME")
            mv "pkg/$NAME.zip" dist/
          else
            tar -czf "dist/$NAME.tar.gz" -C pkg "$NAME"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  npm-packages:
    name: npm packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          pattern: dist-*

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release archives
        run: |
          set -euo pipefail
          mkdir -p extracted
          for f in artifacts/netivri_*.tar.gz; do tar -xzf "$f" -C extracted; done
          for f in artifacts/netivri_*.zip; do unzip -q "$f" -d extracted; done

      - name: Build npm packages
        run: |
          set -euo pipefail
          node npm/scripts/build-packages.js \
            --version "${{ steps.version.outputs.version }}" \
            --archive-dir extracted --out npm-out

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p npm-dist
          for d in npm-out/*/; do
            (cd "$d" && npm pack --pack-destination "${GITHUB_WORKSPACE}/npm-dist")
          done
          ls -l npm-dist

      - uses: actions/upload-artifact@v7
        with:
          name: npm-dist
          path: npm-dist/*.tgz
          if-no-files-found: error

  # Publishes with the NPM_TOKEN secret when it exists and through npm Trusted
  # Publishing (GitHub OIDC, no secret) when it does not; the repository
  # variable NPM_PUBLISH=off skips the npm step. A dry run only executes
  # `npm publish --dry-run`. Details in docs/release.md.
  npm-publish:
    name: publish to npm
    needs: [publish, npm-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Trusted Publishing needs npm 11.5.1 or newer on node 22.14 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Make sure npm is new enough
        shell: bash
        run: |
          set -euo pipefail
          need=11.5.1
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "${need}" "${have}" | sort -V | head -n 1)" != "${need}" ]; then
            npm install -g "npm@^${need}"
          fi
          npm --version

      - uses: actions/download-artifact@v8
        with:
          name: npm-dist
          path: npm-dist

      - name: Choose the publish mode
        id: mode
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            mode=dry-run
            version=0.0.0-dryrun
          else
            version="${GITHUB_REF_NAME#v}"
            if [ "${NPM_PUBLISH:-}" = "off" ]; then
              mode=off
            elif [ -n "${NPM_TOKEN:-}" ]; then
              mode=token
            else
              mode=oidc
            fi
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "npm publish: version ${version}, mode ${mode}" | tee -a "${GITHUB_STEP_SUMMARY}"

      # The token goes through an npmrc that reads it from the environment, so
      # it is never written to disk or echoed.
      - name: Configure token authentication
        if: steps.mode.outputs.mode == 'token'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "${RUNNER_TEMP}/npmrc"
          echo "NPM_CONFIG_USERCONFIG=${RUNNER_TEMP}/npmrc" >> "${GITHUB_ENV}"

      - name: Publish
        if: steps.mode.outputs.mode != 'off'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.mode.outputs.version }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: bash scripts/npm-publish.sh "${VERSION}" npm-dist "${MODE}"

  install-test:
    name: install test (${{ matrix.os }})
    needs: [build, npm-packages]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          pattern: dist-*

      - uses: actions/download-artifact@v8
        with:
          name: npm-dist
          path: npm-dist

      - name: Compute version and checksums
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
          fi
          # Same SHA256SUMS the publish job generates (macOS has no sha256sum).
          cd artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum netivri_*.zip netivri_*.tar.gz > SHA256SUMS
          else
            shasum -a 256 netivri_*.zip netivri_*.tar.gz > SHA256SUMS
          fi

      # A config file makes `sub list` read and parse the configuration, which
      # proves the installed binary works on its own.
      - name: Standalone installer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          dir="${RUNNER_TEMP}/netivri-inst/bin"
          home="${RUNNER_TEMP}/netivri-home"
          mkdir -p "${home}"
          printf 'listen.port: 7890\n' > "${home}/config.ktav"

          sh install.sh --version "${VER}" --base-url "file://${GITHUB_WORKSPACE}/artifacts" --dir "${dir}"
          "${dir}/netivri" version
          "${dir}/netivri" sub list --home "${home}"
          test -f "${dir}/../share/netivri/LICENSE"

          # Upgrade in place works.
          sh install.sh --version "${VER}" --base-url "file://${GITHUB_WORKSPACE}/artifacts" --dir "${dir}"

          # Re-installing while the daemon of the installed binary runs: the
          # replacement is a rename, so the daemon keeps answering and the
          # installer tells the user to restart it.
          "${dir}/netivri" up --port 0 --home "${home}"
          sh install.sh --version "${VER}" --base-url "file://${GITHUB_WORKSPACE}/artifacts" --dir "${dir}" 2> "${RUNNER_TEMP}/reinstall.err"
          cat "${RUNNER_TEMP}/reinstall.err"
          grep -Eq 'note: (netivri is|a netivri process is) running' "${RUNNER_TEMP}/reinstall.err"
          "${dir}/netivri" status --home "${home}"
          "${dir}/netivri" version
          "${dir}/netivri" down --home "${home}"

          # --quiet prints nothing at all on success.
          quiet_out="$(sh install.sh --version "${VER}" --base-url "file://${GITHUB_WORKSPACE}/artifacts" --dir "${dir}" --quiet 2>&1)"
          test -z "${quiet_out}"

          # Local source mode: the extracted archive and an npm platform
          # package layout; no download, no checksum.
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) plat=linux_amd64 ;;
            Linux-aarch64) plat=linux_arm64 ;;
            Darwin-x86_64) plat=darwin_amd64 ;;
            Darwin-arm64) plat=darwin_arm64 ;;
            *) echo "unexpected platform" >&2; exit 1 ;;
          esac
          ex="${RUNNER_TEMP}/netivri-extracted"
          rm -rf "${ex}"
          mkdir -p "${ex}"
          tar -xzf "artifacts/netivri_${VER}_${plat}.tar.gz" -C "${ex}"
          src="${ex}/netivri_${VER}_${plat}"
          dir2="${RUNNER_TEMP}/netivri-inst2/bin"
          rm -rf "${RUNNER_TEMP}/netivri-inst2"
          sh install.sh --from-dir "${src}" --dir "${dir2}" --quiet
          "${dir2}/netivri" sub list --home "${home}"
          test -f "${dir2}/../share/netivri/LICENSE"
          test -d "${dir2}/../share/netivri/THIRD_PARTY_LICENSES"

          pkg="${RUNNER_TEMP}/netivri-pkg"
          dir3="${RUNNER_TEMP}/netivri-inst3/bin"
          rm -rf "${pkg}" "${RUNNER_TEMP}/netivri-inst3"
          mkdir -p "${pkg}/bin"
          cp "${src}"/netivri "${pkg}/bin/"
          cp "${src}/LICENSE" "${pkg}/LICENSE"
          cp -R "${src}/THIRD_PARTY_LICENSES" "${pkg}/THIRD_PARTY_LICENSES"
          sh install.sh --from-dir "${pkg}" --dir "${dir3}" --quiet
          "${dir3}/netivri" sub list --home "${home}"
          test -f "${dir3}/../share/netivri/LICENSE"

          # A source directory without a binary, and --from-dir combined with
          # --version, are refused.
          if sh install.sh --from-dir "${RUNNER_TEMP}" --dir "${RUNNER_TEMP}/netivri-inst4/bin"; then
            echo "installer accepted a directory without a binary" >&2
            exit 1
          fi
          set +e
          sh install.sh --from-dir "${src}" --version "${VER}" --dir "${RUNNER_TEMP}/netivri-inst4/bin"
          rc=$?
          set -e
          test "${rc}" -eq 2
          test ! -e "${RUNNER_TEMP}/netivri-inst4/bin/netivri"

          # A corrupted archive must be refused and install nothing.
          bad="${RUNNER_TEMP}/netivri-bad"
          rm -rf "${bad}" "${RUNNER_TEMP}/netivri-bad-inst"
          cp -R artifacts "${bad}"
          for f in "${bad}"/netivri_*.tar.gz; do printf 'x' >> "${f}"; done
          if sh install.sh --version "${VER}" --base-url "file://${bad}" --dir "${RUNNER_TEMP}/netivri-bad-inst/bin"; then
            echo "installer accepted a corrupted archive" >&2
            exit 1
          fi
          test ! -e "${RUNNER_TEMP}/netivri-bad-inst/bin/netivri"

          sh install.sh --uninstall --dir "${dir}"
          test ! -e "${dir}/netivri"

      - name: Standalone installer (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.version.outputs.version }}'
          $dir = Join-Path $env:RUNNER_TEMP 'netivri-inst\bin'
          $home_ = Join-Path $env:RUNNER_TEMP 'netivri-home'
          New-Item -ItemType Directory -Force -Path $home_ | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $home_ 'config.ktav'), "listen.port: 7890`n")
          $artifacts = Join-Path $env:GITHUB_WORKSPACE 'artifacts'

          & .\install.ps1 -Version $ver -BaseUrl $artifacts -InstallDir $dir
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw "install.ps1 failed" }
          & (Join-Path $dir 'netivri.exe') version
          if ($LASTEXITCODE -ne 0) { throw "netivri version failed" }
          & (Join-Path $dir 'netivri.exe') sub list --home $home_
          if ($LASTEXITCODE -ne 0) { throw "netivri sub list failed" }

          # Re-installing while a daemon runs from the install dir: the
          # running exe cannot be overwritten, so the installer renames it aside
          # and installs the new file.
          $exe = Join-Path $dir 'netivri.exe'
          & $exe up --port 0 --home $home_ | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'netivri up (daemon) failed' }
          & .\install.ps1 -Version $ver -BaseUrl $artifacts -InstallDir $dir
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw 'install.ps1 failed while the daemon runs' }
          $aside = @(Get-ChildItem -Path $dir -Filter '*.old-*')
          if ($aside.Count -lt 1) { throw 'nothing was renamed aside although the daemon holds the files' }
          & $exe status --home $home_ | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'the daemon stopped answering after the re-install' }
          & $exe version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'the re-installed binary does not run' }
          & $exe down --home $home_ | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'netivri down failed' }
          for ($i = 0; $i -lt 20 -and (Get-Process -Name netivri -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 1 }
          & .\install.ps1 -Version $ver -BaseUrl $artifacts -InstallDir $dir -Quiet
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw 'install.ps1 failed after the daemon stopped' }
          if (@(Get-ChildItem -Path $dir -Filter '*.old-*').Count -ne 0) { throw 'leftover .old-* files were not cleaned up' }

          # Local source mode: the extracted archive and an npm package layout.
          $ex = Join-Path $env:RUNNER_TEMP 'netivri-extracted'
          if (Test-Path $ex) { Remove-Item -Recurse -Force $ex }
          Expand-Archive -Path (Join-Path $artifacts "netivri_${ver}_windows_amd64.zip") -DestinationPath $ex
          $src = Join-Path $ex "netivri_${ver}_windows_amd64"
          $dir2 = Join-Path $env:RUNNER_TEMP 'netivri-inst2\bin'
          & .\install.ps1 -FromDir $src -InstallDir $dir2 -Quiet
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw 'install.ps1 -FromDir (archive layout) failed' }
          & (Join-Path $dir2 'netivri.exe') sub list --home $home_
          if ($LASTEXITCODE -ne 0) { throw 'netivri sub list failed after -FromDir' }
          if (-not (Test-Path (Join-Path $dir2 '..\share\netivri\LICENSE'))) { throw 'LICENSE was not installed (archive layout)' }
          $pkg = Join-Path $env:RUNNER_TEMP 'netivri-pkg'
          if (Test-Path $pkg) { Remove-Item -Recurse -Force $pkg }
          New-Item -ItemType Directory -Force -Path (Join-Path $pkg 'bin') | Out-Null
          Copy-Item (Join-Path $src 'netivri.exe') (Join-Path $pkg 'bin')
          Copy-Item (Join-Path $src 'LICENSE') $pkg
          Copy-Item -Recurse (Join-Path $src 'THIRD_PARTY_LICENSES') $pkg
          $dir3 = Join-Path $env:RUNNER_TEMP 'netivri-inst3\bin'
          & .\install.ps1 -FromDir $pkg -InstallDir $dir3 -Quiet
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw 'install.ps1 -FromDir (npm layout) failed' }
          if (-not (Test-Path (Join-Path $dir3 '..\share\netivri\LICENSE'))) { throw 'LICENSE was not installed (npm layout)' }
          $usageFailed = $false
          try {
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -FromDir $src -Version $ver -InstallDir (Join-Path $env:RUNNER_TEMP 'netivri-inst4\bin')
            if ($LASTEXITCODE -eq 2) { $usageFailed = $true }
          } catch { $usageFailed = $true }
          if (-not $usageFailed) { throw '-FromDir together with -Version was not a usage error (exit 2)' }

          # A corrupted archive must be refused and install nothing.
          $bad = Join-Path $env:RUNNER_TEMP 'netivri-bad'
          if (Test-Path $bad) { Remove-Item -Recurse -Force $bad }
          Copy-Item -Recurse $artifacts $bad
          Get-ChildItem $bad -Filter 'netivri_*.zip' | ForEach-Object { Add-Content -Path $_.FullName -Value 'x' }
          $badDir = Join-Path $env:RUNNER_TEMP 'netivri-bad-inst\bin'
          $failed = $false
          try {
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Version $ver -BaseUrl $bad -InstallDir $badDir
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          } catch { $failed = $true }
          if (-not $failed) { throw 'installer accepted a corrupted archive' }
          if (Test-Path (Join-Path $badDir 'netivri.exe')) { throw 'a corrupted archive was installed' }

          & .\install.ps1 -Uninstall -InstallDir $dir
          if (Test-Path (Join-Path $dir 'netivri.exe')) { throw 'uninstall left the binary behind' }

      # -AddToPath must keep the registry type and the %VAR% entries of the
      # user PATH. The runner's own value is restored at the end.
      - name: Installer PATH handling (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.version.outputs.version }}'
          $artifacts = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $expand = [Microsoft.Win32.RegistryValueKind]::ExpandString
          $plain = [Microsoft.Win32.RegistryValueKind]::String
          $noExpand = [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $hadPath = $key.GetValueNames() -contains 'Path'
          $origKind = $expand
          $origRaw = ''
          if ($hadPath) {
            $origKind = $key.GetValueKind('Path')
            $origRaw = [string]$key.GetValue('Path', '', $noExpand)
          }
          function Expect([string]$what, $actual, $wanted) {
            if ($actual -ne $wanted) { throw "$what`: got [$actual], wanted [$wanted]" }
          }
          try {
            # REG_EXPAND_SZ with a %VAR% entry: kept verbatim, the install dir
            # under %LOCALAPPDATA% is appended in its %VAR% form.
            $seed = '%SystemRoot%\system32;C:\netivri-path-test\bin'
            $key.SetValue('Path', $seed, $expand)
            $dir = Join-Path $env:LOCALAPPDATA 'netivri-path-test\bin'
            & .\install.ps1 -Version $ver -BaseUrl $artifacts -InstallDir $dir -AddToPath -Quiet
            if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw 'install.ps1 -AddToPath failed' }
            $want = "$seed;%LOCALAPPDATA%\netivri-path-test\bin"
            Expect 'PATH value' ([string]$key.GetValue('Path', '', $noExpand)) $want
            Expect 'PATH kind' ([string]$key.GetValueKind('Path')) 'ExpandString'

            # A second run finds the entry (through the expansion) and leaves
            # the value alone.
            & .\install.ps1 -Version $ver -BaseUrl $artifacts -InstallDir $dir -AddToPath -Quiet
            if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw 'second install.ps1 -AddToPath failed' }
            Expect 'PATH value after a repeat' ([string]$key.GetValue('Path', '', $noExpand)) $want

            # An entry that is already there in its expanded form is found.
            $expandedDir = [System.IO.Path]::GetFullPath($dir).TrimEnd('\')
            $key.SetValue('Path', "C:\a;$expandedDir", $expand)
            & .\install.ps1 -Version $ver -BaseUrl $artifacts -InstallDir $dir -AddToPath -Quiet
            Expect 'PATH value with an expanded entry' ([string]$key.GetValue('Path', '', $noExpand)) "C:\a;$expandedDir"

            # A directory outside %LOCALAPPDATA% is appended as a full path.
            $dir2 = Join-Path $env:RUNNER_TEMP 'netivri-path-test2\bin'
            $full2 = [System.IO.Path]::GetFullPath($dir2).TrimEnd('\')
            $key.SetValue('Path', $seed, $expand)
            & .\install.ps1 -Version $ver -BaseUrl $artifacts -InstallDir $dir2 -AddToPath -Quiet
            Expect 'PATH value for an outside dir' ([string]$key.GetValue('Path', '', $noExpand)) "$seed;$full2"
            Expect 'PATH kind for an outside dir' ([string]$key.GetValueKind('Path')) 'ExpandString'

            # REG_SZ stays REG_SZ and never receives a %VAR% entry.
            $key.SetValue('Path', 'C:\a;C:\b', $plain)
            & .\install.ps1 -Version $ver -BaseUrl $artifacts -InstallDir $dir -AddToPath -Quiet
            Expect 'REG_SZ PATH value' ([string]$key.GetValue('Path', '', $noExpand)) "C:\a;C:\b;$expandedDir"
            Expect 'REG_SZ PATH kind' ([string]$key.GetValueKind('Path')) 'String'

            # No PATH value at all: created with the %VAR% form.
            $key.DeleteValue('Path')
            & .\install.ps1 -Version $ver -BaseUrl $artifacts -InstallDir $dir -AddToPath -Quiet
            Expect 'new PATH value' ([string]$key.GetValue('Path', '', $noExpand)) '%LOCALAPPDATA%\netivri-path-test\bin'
            Expect 'new PATH kind' ([string]$key.GetValueKind('Path')) 'ExpandString'
          } finally {
            if ($hadPath) { $key.SetValue('Path', $origRaw, $origKind) } else { $key.DeleteValue('Path', $false) }
            $key.Close()
          }

      - name: Standalone installer (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.version.outputs.version }}'
          $dir = Join-Path $env:RUNNER_TEMP 'netivri-inst7\bin'
          $home_ = Join-Path $env:RUNNER_TEMP 'netivri-home'
          & ./install.ps1 -Version $ver -BaseUrl (Join-Path $env:GITHUB_WORKSPACE 'artifacts') -InstallDir $dir
          & (Join-Path $dir 'netivri.exe') sub list --home $home_
          if ($LASTEXITCODE -ne 0) { throw 'netivri sub list failed' }

      # Install the packed tarballs into a private prefix (the registry has
      # no such version) and run the launcher from there.
      - name: npm global install from the packed tarballs
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          plat="$(node -p "process.platform + '-' + process.arch")"
          prefix="${RUNNER_TEMP}/npm-global"
          home="${RUNNER_TEMP}/netivri-home"
          npm install -g --prefix "${prefix}" \
            "${GITHUB_WORKSPACE}/npm-dist/netivri-${plat}-${VER}.tgz" \
            "${GITHUB_WORKSPACE}/npm-dist/netivri-${VER}.tgz"
          root="$(npm root -g --prefix "${prefix}")"
          node "${root}/netivri/bin/netivri.js" version
          node "${root}/netivri/bin/netivri.js" sub list --home "${home}"

  # .deb and .rpm of the Linux archives. The amd64 packages are installed and
  # removed again, the .deb on the runner and the .rpm in a Fedora container;
  # the arm64 ones are only built (no arm64 runner here).
  linux-packages:
    name: linux packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          pattern: dist-linux-*

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the packages
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.45.0
          mkdir -p linux-pkgs extracted
          for arch in amd64 arm64; do
            tar -xzf "artifacts/netivri_${VER}_linux_${arch}.tar.gz" -C extracted
            rm -rf pkgroot
            cp -R "extracted/netivri_${VER}_linux_${arch}" pkgroot
            for fmt in deb rpm; do
              VERSION="${VER}" ARCH="${arch}" \
                "$(go env GOPATH)/bin/nfpm" package --config packaging/nfpm.yaml \
                --packager "${fmt}" --target "linux-pkgs/netivri_${VER}_linux_${arch}.${fmt}"
            done
          done
          ls -l linux-pkgs

      - name: Install and remove the .deb
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          sudo dpkg -i "linux-pkgs/netivri_${VER}_linux_amd64.deb"
          netivri version
          dpkg -s netivri | grep -E '^(Package|Version|Architecture):'
          test -f /usr/share/doc/netivri/LICENSE
          test -d /usr/share/doc/netivri/THIRD_PARTY_LICENSES
          sudo dpkg -r netivri
          if [ -e /usr/bin/netivri ]; then echo "netivri is still installed" >&2; exit 1; fi
          dpkg-deb -I "linux-pkgs/netivri_${VER}_linux_arm64.deb" | grep -E 'Architecture: arm64'

      - name: Install and remove the .rpm (Fedora)
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          docker run --rm -v "${PWD}/linux-pkgs:/pkgs:ro" fedora:latest sh -euc "
            rpm -i /pkgs/netivri_${VER}_linux_amd64.rpm
            netivri version
            rpm -qi netivri
            test -f /usr/share/doc/netivri/LICENSE
            rpm -e netivri
            if [ -e /usr/bin/netivri ]; then echo 'netivri is still installed' >&2; exit 1; fi
            rpm -qp --queryformat '%{ARCH}\n' /pkgs/netivri_${VER}_linux_arm64.rpm | grep -x aarch64
          "

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-linux
          path: linux-pkgs/*
          if-no-files-found: error

  # Nothing is published unless every dependency license is still allowed.
  licenses:
    name: license check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check licenses
        shell: bash
        run: bash scripts/check-licenses.sh

  publish:
    name: checksums and release
    needs: [build, linux-packages, npm-packages, install-test, licenses]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          pattern: dist-*

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          name: pkg-linux

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          name: npm-dist

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
          fi

      # The installers of the tag, the Scoop manifest and the Homebrew formula
      # sit next to the archives, so a release page is enough to install from.
      - name: Installers and package manifests
        run: |
          set -euo pipefail
          cp install.sh install.ps1 artifacts/
          bash scripts/package-manifests.sh "${{ steps.version.outputs.version }}" artifacts
          node -e 'JSON.parse(require("fs").readFileSync("artifacts/netivri.json", "utf8"))'
          ruby -c artifacts/netivri.rb
          sh -n artifacts/install.sh

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum netivri_*.zip netivri_*.tar.gz netivri_*.deb netivri_*.rpm \
            install.sh install.ps1 netivri.json netivri.rb netivri-*.tgz > SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS
          if-no-files-found: error

      - name: Release notes from the changelog
        if: github.event_name == 'push'
        run: bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md

      # Anyone can check an archive against this workflow run with
      # `gh attestation verify <file> --repo PHPCraftdream/netivri`.
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/netivri_*.zip
            artifacts/netivri_*.tar.gz
            artifacts/netivri_*.deb
            artifacts/netivri_*.rpm
            artifacts/netivri-*.tgz
            artifacts/install.sh
            artifacts/install.ps1
            artifacts/netivri.json
            artifacts/netivri.rb
            artifacts/SHA256SUMS

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          case "${GITHUB_REF_NAME}" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${flags[@]}" \
            artifacts/SHA256SUMS artifacts/netivri_*.zip artifacts/netivri_*.tar.gz \
            artifacts/netivri_*.deb artifacts/netivri_*.rpm artifacts/netivri-*.tgz \
            artifacts/install.sh artifacts/install.ps1 artifacts/netivri.json artifacts/netivri.rb
