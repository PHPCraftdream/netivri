name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: "Go package patterns for go test"
        type: string
        default: "./..."
      tags:
        description: "Extra build tags (comma-separated)"
        type: string
        default: ""
      run:
        description: "-run regex to select tests"
        type: string
        default: ""
      os:
        description: "Runner OS"
        type: choice
        options:
          - all
          - ubuntu
          - windows
          - macos
        default: all
      race:
        description: "Enable race detector"
        type: boolean
        default: true
      benchtime:
        description: "go test -benchtime for the bench job, e.g. 1x, 2s, 5x"
        type: string
        default: 1x

permissions:
  contents: read

# Only pull requests cancel their superseded runs. A push run gets its own
# group: a stuck run on main must never block (or hold pending) the next one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PACKAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.packages || './...' }}
  TAGS: ${{ github.event_name == 'workflow_dispatch' && inputs.tags || '' }}
  RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.run || '' }}
  RACE: ${{ (github.event_name != 'workflow_dispatch' || inputs.race) && '1' || '0' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix_os: ${{ steps.cfg.outputs.matrix_os }}
    steps:
      - name: Compute OS matrix
        id: cfg
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.os }}" ] && [ "${{ inputs.os }}" != "all" ]; then
            echo 'matrix_os=["${{ inputs.os }}-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix_os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: |
          # third_party holds vendored upstream sources: not ours to format.
          out="$(git ls-files -z '*.go' ':(exclude)third_party' | xargs -0 gofmt -l)"
          if [ -n "${out}" ]; then
            echo "gofmt needed on:"
            echo "${out}"
            exit 1
          fi

      - name: go mod tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        shell: bash
        run: |
          go vet ./...
          go vet -tags integration,e2e,bench ./...

      - name: Build (all levels)
        shell: bash
        run: go build -tags integration,e2e,bench ./...

      # The release workflow cuts the GitHub Release notes with this script.
      - name: Release notes script
        shell: bash
        run: bash scripts/test-release-notes.sh

  unit:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.matrix_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Unit tests
        shell: bash
        env:
          CI_PACKAGES: ${{ env.PACKAGES }}
          # Unit stays hermetic: user tags are ignored here, and the
          # coverage floors measure unit tests only.
          CI_TAGS: ""
          CI_RUN: ${{ env.RUN }}
          CI_RACE: ${{ env.RACE }}
          CI_COVER: "1"
        run: bash scripts/ci-test.sh

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: ignore

      - name: Check coverage floors
        if: env.PACKAGES == './...' && env.RUN == ''
        shell: bash
        run: bash scripts/check-coverage.sh coverage.out | tee "${GITHUB_STEP_SUMMARY}"

  integration:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.matrix_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Integration tests
        shell: bash
        env:
          CI_PACKAGES: ${{ env.PACKAGES }}
          CI_RUN: ${{ env.RUN }}
          CI_RACE: ${{ matrix.os != 'windows-latest' && env.RACE || '0' }}
          CI_COVER: "0"
          CI_TAGS: integration${{ env.TAGS != '' && format(',{0}', env.TAGS) || '' }}
        run: bash scripts/ci-test.sh

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: E2E tests
        shell: bash
        run: |
          set -euo pipefail
          targets="${{ env.PACKAGES }}"
          if [ -z "${targets}" ]; then
            targets="./..."
          fi
          # Resolve the Go package patterns (a go list failure fails the
          # step) and keep only the packages that have e2e-tagged test files
          # directly in their directory: the e2e job runs just those.
          pkgs=""
          while read -r dir ipath; do
            for f in "${dir}"/*_test.go; do
              [ -e "${f}" ] || continue
              if grep -qE '^//go:build .*\be2e\b' "${f}"; then
                pkgs="${pkgs} ${ipath}"
                break
              fi
            done
          done < <(go list -tags e2e -f '{{.Dir}} {{.ImportPath}}' ${targets})
          if [ -n "${pkgs}" ]; then
            export CI_PACKAGES="${pkgs# }"
            export CI_TAGS="e2e${{ env.TAGS != '' && format(',{0}', env.TAGS) || '' }}"
            export CI_RUN="${{ env.RUN }}"
            export CI_RACE="0"
            export CI_COVER="0"
            bash scripts/ci-test.sh
          else
            echo "no e2e test files (*_test.go with '//go:build ... e2e') found; skipping"
          fi

  bench:
    if: github.event_name == 'workflow_dispatch' && contains(inputs.tags, 'bench')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Benchmarks
        shell: bash
        run: |
          set -o pipefail
          bt="${{ inputs.benchtime }}"
          if [ -z "${bt}" ]; then
            bt="1x"
          fi
          go test -tags "${{ env.TAGS }}" -run '^$' -bench . -benchmem -benchtime "${bt}" -count=1 ${{ env.PACKAGES }} | tee "${RUNNER_TEMP}/bench-output.txt"
          {
            echo '```'
            grep '^Benchmark' "${RUNNER_TEMP}/bench-output.txt" || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  npm:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.matrix_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Syntax check
        shell: bash
        run: |
          for f in npm/netivri/bin/netivri.js npm/scripts/build-packages.js npm/test/*.js; do
            node --check "${f}"
          done

      - name: npm package tests
        shell: bash
        run: node --test npm/test/*.test.js

      # The release workflow packs and publishes these packages; this runs the
      # same build, pack and publish dry-run on fake archives, so a wrong
      # package or tarball name fails the pull request and not the release.
      - name: Pack the npm packages and dry-run the publish
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ver=0.0.0-ci
          mkdir -p fake-archives npm-dist
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            dir="fake-archives/netivri_${ver}_${target}"
            mkdir -p "${dir}/THIRD_PARTY_LICENSES"
            bin=netivri
            case "${target}" in windows_*) bin=netivri.exe ;; esac
            printf 'binary' > "${dir}/${bin}"
            cp LICENSE "${dir}/LICENSE"
            printf 'notices' > "${dir}/THIRD_PARTY_LICENSES/notices.txt"
          done
          node npm/scripts/build-packages.js --version "${ver}" --archive-dir fake-archives --out npm-out
          for d in npm-out/*/; do
            (cd "${d}" && npm pack --pack-destination "${GITHUB_WORKSPACE}/npm-dist")
          done
          ls -l npm-dist
          bash scripts/npm-publish.sh "${ver}" npm-dist dry-run

  # The Linux binary must stay static: it has to run on musl (Alpine) too. The
  # release workflow checks it again; here a regression fails the pull request.
  linux-static:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and check that the binary is statically linked
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p build
          go build -trimpath -o build/netivri ./cmd/netivri
          file build/netivri
          file build/netivri | grep -q 'statically linked'

      # The amd64 binary runs in Alpine (musl): start the angel, ask it, stop it.
      - name: Run the binary in Alpine
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          cat > alpine-smoke.sh <<'SCRIPT'
          set -eu
          test -f /etc/alpine-release
          mkdir -p /tmp/home
          printf 'listen.port: 7890\n' > /tmp/home/config.ktav
          /w/build/netivri version
          /w/build/netivri sub list --home /tmp/home
          /w/build/netivri up --port 0 --home /tmp/home
          /w/build/netivri status --home /tmp/home
          /w/build/netivri down --home /tmp/home
          SCRIPT
          docker run --rm -v "${GITHUB_WORKSPACE}:/w" alpine:3 sh /w/alpine-smoke.sh

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The allow-list, the audited ignores and the declared-license checks
      # live in the script (see docs/licenses.md). Any new failure needs human
      # review: never auto-allow a license.
      - name: Check licenses
        shell: bash
        run: bash scripts/check-licenses.sh

      - name: Collect third-party notices
        shell: bash
        run: bash scripts/collect-licenses.sh "${RUNNER_TEMP}/third-party"

  ci-ok:
    if: always()
    needs: [setup, lint, unit, integration, e2e, bench, npm, linux-static, licenses]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        shell: bash
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "one or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "all CI jobs passed"
