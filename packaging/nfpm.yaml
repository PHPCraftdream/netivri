# .deb and .rpm of the Linux release, built by nfpm in the release workflow
# (job "linux packages"). VERSION, ARCH (amd64 or arm64), BIN (the binary) and
# DOCS (the directory with LICENSE, README.md and THIRD_PARTY_LICENSES) come
# from the environment.
name: netivri
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: PHPCraftdream
description: |
  Local SOCKS5/SOCKS4/HTTP proxy service built on Mihomo.
  It keeps one proxy port, routes each login through the provider and exit
  country chosen for it, and refreshes its subscriptions by itself.
homepage: https://github.com/PHPCraftdream/netivri
license: GPL-3.0-only
contents:
  - src: ${BIN}
    dst: /usr/bin/netivri
    file_info:
      mode: 0755
  - src: ${DOCS}/LICENSE
    dst: /usr/share/doc/netivri/LICENSE
  - src: ${DOCS}/README.md
    dst: /usr/share/doc/netivri/README.md
  - src: ${DOCS}/THIRD_PARTY_LICENSES
    dst: /usr/share/doc/netivri/THIRD_PARTY_LICENSES
    type: tree
