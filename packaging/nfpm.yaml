# .deb and .rpm of the Linux release, built by nfpm in the release workflow
# (job "linux packages"). VERSION and ARCH (amd64 or arm64) come from the
# environment; the extracted archive of that architecture is copied to
# pkgroot/ first, because nfpm does not expand variables in file paths.
name: netivri
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: PHPCraftdream
description: |
  Local SOCKS5/SOCKS4/HTTP proxy service built on Mihomo.
  It keeps one proxy port, routes each login through the provider and exit
  country chosen for it, and refreshes its subscriptions by itself.
homepage: https://github.com/PHPCraftdream/netivri
license: GPL-3.0-only
contents:
  - src: pkgroot/netivri
    dst: /usr/bin/netivri
    file_info:
      mode: 0755
  - src: pkgroot/LICENSE
    dst: /usr/share/doc/netivri/LICENSE
  - src: pkgroot/README.md
    dst: /usr/share/doc/netivri/README.md
  - src: pkgroot/THIRD_PARTY_LICENSES
    dst: /usr/share/doc/netivri/THIRD_PARTY_LICENSES
    type: tree
